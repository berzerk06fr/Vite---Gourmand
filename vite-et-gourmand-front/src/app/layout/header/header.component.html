<header class="bg-white border-bottom shadow-sm sticky-top">
  <nav class="navbar navbar-expand-lg navbar-light py-3" aria-label="Navigation principale">
    <div class="container">
      
      <!-- Logo et Marque -->
      <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2 fw-bold text-dark fs-4" aria-label="Vite et Gourmand, retour à la page d'accueil">
        <i class="bi bi-egg-fried text-warning" aria-hidden="true"></i>
        <span>Vite & <span class="text-warning">Gourmand</span></span>
      </a>

      <!-- Bouton Hamburger Mobile (Accessible avec ARIA) -->
      <button 
        class="navbar-toggler" 
        type="button" 
        (click)="toggleNavbar()" 
        [attr.aria-expanded]="!isNavCollapsed()" 
        aria-controls="mainNavbarContent" 
        aria-label="Basculer la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Liens de navigation & Actions -->
      <div class="collapse navbar-collapse" [class.show]="!isNavCollapsed()" id="mainNavbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-2">
          <li class="nav-item">
            <a routerLink="/" (click)="closeNavbar()" routerLinkActive="active fw-bold text-warning" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
              Accueil
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/menus" (click)="closeNavbar()" routerLinkActive="active fw-bold text-warning" class="nav-link">
              Nos Menus
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/contact" (click)="closeNavbar()" routerLinkActive="active fw-bold text-warning" class="nav-link">
              Contact
            </a>
          </li>
        </ul>

        <!-- Bloc authentification / profil -->
        <div class="d-flex align-items-center gap-2 pt-2 pt-lg-0">
          @if (!estConnecte()) {
            <a routerLink="/login" (click)="closeNavbar()" class="btn btn-outline-vg-primary">
              <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i> Connexion
            </a>
            <a routerLink="/register" (click)="closeNavbar()" class="btn btn-vg-primary shadow-sm">
              Créer un compte
            </a>
          } @else {
            <a routerLink="/mon-compte" (click)="closeNavbar()" class="btn btn-light border text-dark fw-semibold">
              <i class="bi bi-person-circle me-1" aria-hidden="true"></i> Mon Espace
            </a>
          }
        </div>
      </div>

    </div>
  </nav>
</header>

security:
    enable_authenticator_manager: true

    # 1. Encoders / Hashers
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # 2. Providers
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # 3. Firewalls
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    # 4. Access Control
    access_control:
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/menus, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/avis$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/avis/en-attente, roles: [ROLE_EMPLOYE, ROLE_ADMIN] }
        - { path: ^/api/avis/\d+/moderation, roles: [ROLE_EMPLOYE, ROLE_ADMIN] }
        - { path: ^/api/avis, roles: IS_AUTHENTICATED_FULLY, methods: [POST] }
        - { path: ^/api/admin/statistiques, roles: ROLE_ADMIN }
        - { path: ^/api/admin/commandes, roles: [ROLE_EMPLOYE, ROLE_ADMIN] }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/commandes, roles: IS_AUTHENTICATED_FULLY }